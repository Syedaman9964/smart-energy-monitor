; ============================================================================
; PlatformIO Configuration File for WattVision ESP32 Energy Monitor
; ============================================================================
; Project: Smart Energy Monitoring & IoT Analytics
; Target MCU: Espressif ESP32-WROOM-32 (NodeMCU-32S / ESP32 Dev Module)
; Framework: Arduino
; ============================================================================

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino

; Serial Monitor Baud Rate
monitor_speed = 115200
upload_speed = 921600

; Compiler Optimization Flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_CDC_ON_BOOT=0

; External Library Dependencies
lib_deps =
    mandar/PZEM-004T-v30 @ ^1.1.2
    bblanchon/ArduinoJson @ ^6.21.3
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    knolleary/PubSubClient @ ^2.8
    Wire
    WiFi
    HTTPClient

; Partition Scheme (Default 4MB with SPIFFS)
board_build.partitions = default.csv
